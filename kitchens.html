<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Home Solutions | Contact</title>
    <!-- Stylesheets same as above -->
    
    <style>
        /* INCLUDE ROOT CSS VARIABLES & RESET HERE */
        /* INCLUDE SIDEBAR CSS HERE */
        
        .contact-container {
            margin-left: 120px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            background: var(--bg-cream);
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6rem;
            max-width: 1200px;
            width: 100%;
        }

        .contact-info h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            margin-bottom: 2rem;
            line-height: 1;
        }

        .contact-details p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
            opacity: 0.8;
        }

        /* Minimalist Form Styles */
        .form-group {
            margin-bottom: 2.5rem;
            position: relative;
        }

        input, textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            padding: 1rem 0;
            font-family: var(--font-body);
            font-size: 1.1rem;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-bottom-color: var(--accent-terra);
        }

        label {
            position: absolute;
            top: 0;
            left: 0;
            font-size: 0.9rem;
            color: #888;
            pointer-events: none;
            transition: 0.3s ease all;
        }

        /* Move label up when input has text or focus */
        input:focus ~ label, input:valid ~ label, 
        textarea:focus ~ label, textarea:valid ~ label {
            top: -20px;
            font-size: 0.8rem;
            color: var(--accent-terra);
        }

        button {
            background: var(--text-dark);
            color: white;
            padding: 1rem 3rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: var(--accent-terra);
        }

        @media (max-width: 900px) {
            .contact-wrapper { grid-template-columns: 1fr; gap: 3rem; }
            .contact-container { margin-left: 60px; padding: 2rem; }
        }
    </style>
</head>
<body>
    
    <!-- INSERT SIDEBAR & NAV HERE -->

    <section class="contact-container">
        <div class="contact-wrapper">
            
            <!-- Left Side: Info -->
            <div class="contact-info">
                <h1>Let's start the<br>conversation.</h1>
                <div class="contact-details">
                    <p><strong>Email:</strong><br>info@mkhomesolutions.ca</p>
                    <p><strong>Phone:</strong><br>(613) 555-0192</p>
                    <p><strong>Area:</strong><br>Serving Ottawa & The Valley</p>
                    
                    <div style="margin-top: 3rem;">
                        <p>We are currently booking consultations for <strong>Fall 2026</strong>.</p>
                    </div>
                </div>
            </div>

            <!-- Right Side: Form -->
            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
                <div class="form-group hover-trigger">
                    <input type="text" name="name" required>
                    <label>Your Name</label>
                </div>

                <div class="form-group hover-trigger">
                    <input type="email" name="email" required>
                    <label>Email Address</label>
                </div>

                <div class="form-group hover-trigger">
                    <textarea name="message" rows="4" required></textarea>
                    <label>Tell us about your project</label>
                </div>

                <button type="submit" class="hover-trigger">Send Message</button>
            </form>

        </div>
    </section>

    <!-- INSERT CURSOR SCRIPT HERE -->

</body>
</html>
